<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tra Cứu Địa Điểm Gần Nhất</title>
  
  <!-- Kết nối PWA Manifest -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-2 sm:p-4 md:p-8">

  <div class="max-w-6xl mx-auto bg-white p-4 sm:p-6 rounded-2xl shadow-lg">
    <h1 class="text-xl sm:text-2xl font-bold text-gray-800 mb-4 sm:mb-6 text-center">
      Tra Cứu Địa Điểm Gần Nhất
    </h1>

    <!-- Ô nhập liệu + Nút Xóa, Dán, Tìm kiếm -->
    <div class="flex flex-col sm:flex-row gap-2.5 mb-6">
      <div class="relative flex-1 flex items-center">
        <input
          type="text"
          id="customerLink"
          placeholder="Dán link Google Map hoặc nhập tọa độ..."
          class="w-full p-2.5 sm:p-3 pr-20 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-xs sm:text-sm text-black"
        />
        <div class="absolute right-1.5 flex items-center gap-1">
          <button
            type="button"
            onclick="clearInput()"
            class="px-2 py-1 text-xs text-gray-400 hover:text-red-500 font-medium rounded hover:bg-gray-100 transition"
          >
            Xóa
          </button>
          <button
            type="button"
            onclick="pasteInput()"
            class="px-2 py-1 text-xs text-blue-600 font-semibold rounded bg-blue-50 hover:bg-blue-100 transition"
          >
            Dán
          </button>
        </div>
      </div>

      <button
        id="searchBtn"
        onclick="handleSearch()"
        class="bg-blue-600 hover:bg-blue-700 text-white font-semibold text-xs sm:text-sm px-5 py-2.5 sm:py-3 rounded-lg transition disabled:bg-gray-400 whitespace-nowrap shadow-sm"
      >
        Tìm vị trí gần nhất
      </button>
    </div>

    <div id="errorMessage" class="hidden bg-red-50 text-red-600 p-3 sm:p-4 rounded-lg mb-6 border border-red-200 text-xs sm:text-sm"></div>

    <div id="resultsContainer" class="hidden space-y-3">
      <h2 class="text-sm sm:text-base font-semibold text-gray-700">
        Kết quả (Sắp xếp từ gần đến xa):
      </h2>

      <div id="resultsList" class="grid grid-cols-1 md:grid-cols-3 gap-3"></div>
    </div>
  </div>

  <script src="locations.js"></script>

  <script>
    // Tự động chạy khi mở trang / nhận dữ liệu chia sẻ từ App khác (WhatsApp)
    window.addEventListener('DOMContentLoaded', () => {
      // 1. Đăng ký Service Worker cho PWA
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW reg error:', err));
      }

      // 2. Kiểm tra xem có phải trang được mở từ nút "Chia sẻ" của WhatsApp không
      const parsedUrl = new URL(window.location.href);
      const sharedText = parsedUrl.searchParams.get('text') || parsedUrl.searchParams.get('url') || parsedUrl.searchParams.get('title');

      if (sharedText) {
        // Tự động điền link vào ô input và thực hiện tìm kiếm luôn
        document.getElementById('customerLink').value = sharedText;
        handleSearch();
      }
    });

    function clearInput() {
      const input = document.getElementById('customerLink');
      input.value = '';
      input.focus();
    }

    async function pasteInput() {
      try {
        const text = await navigator.clipboard.readText();
        if (text) {
          document.getElementById('customerLink').value = text;
        }
      } catch (err) {
        alert('Không thể tự động dán. Bạn hãy nhấn giữ ô nhập và chọn "Dán" nhé!');
      }
    }

    async function copyMapLink(url, btnElement) {
      try {
        await navigator.clipboard.writeText(url);
        const originalText = btnElement.innerHTML;
        btnElement.innerText = 'Đã chép!';
        btnElement.classList.add('bg-green-100', 'text-green-700');

        setTimeout(() => {
          btnElement.innerHTML = originalText;
          btnElement.classList.remove('bg-green-100', 'text-green-700');
        }, 1500);
      } catch (err) {
        alert('Không thể sao chép link!');
      }
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = ((lat2 - lat1) * Math.PI) / 180;
      const dLon = ((lon2 - lon1) * Math.PI) / 180;
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos((lat1 * Math.PI) / 180) *
          Math.cos((lat2 * Math.PI) / 180) *
          Math.sin(dLon / 2) *
          Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return (R * c).toFixed(2);
    }

    async function extractCoordsFromUrl(rawUrl) {
      if (!rawUrl) return null;

      let url = rawUrl.trim();
      try { url = decodeURIComponent(url); } catch (e) {}

      // Trường hợp trong đoạn text được chia sẻ có chứa link hoặc tọa độ
      const urlRegex = /(https?:\/\/[^\s]+)/g;
      const matchUrl = url.match(urlRegex);
      if (matchUrl) {
        url = matchUrl[0];
      }

      const matchDirect = url.match(/(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)/);
      if (matchDirect) {
        return { lat: parseFloat(matchDirect[1]), lng: parseFloat(matchDirect[2]) };
      }

      const matchAt = url.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
      if (matchAt) {
        return { lat: parseFloat(matchAt[1]), lng: parseFloat(matchAt[2]) };
      }

      const matchData = url.match(/(!3d|q=|ll=|center=)(-?\d+\.\d+)(!4d|,|%2C)(-?\d+\.\d+)/);
      if (matchData) {
        return { lat: parseFloat(matchData[2]), lng: parseFloat(matchData[4]) };
      }

      if (url.includes('goo.gl') || url.includes('maps.app')) {
        const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.protocol === 'file:';

        if (isLocal) {
          try {
            const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
            const res = await fetch(proxyUrl);
            const data = await res.json();
            const combined = (data?.status?.url || '') + " " + (data?.contents || '');

            const mAt = combined.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
            if (mAt) return { lat: parseFloat(mAt[1]), lng: parseFloat(mAt[2]) };

            const mData = combined.match(/(!3d|q=|center=)(-?\d+\.\d+)(!4d|,|%2C)(-?\d+\.\d+)/);
            if (mData) return { lat: parseFloat(mData[2]), lng: parseFloat(mData[4]) };
          } catch (err) {
            console.warn('Proxy Local error:', err);
          }
        } else {
          try {
            const res = await fetch(`/api/resolve?url=${encodeURIComponent(url)}`);
            const data = await res.json();
            if (data.success && data.lat && data.lng) {
              return { lat: data.lat, lng: data.lng };
            }
          } catch (err) {
            console.warn('Vercel API error:', err);
          }
        }
      }

      return null;
    }

    let currentResults = [];

    async function shareLocationWithImage(index) {
      const item = currentResults[index];
      const shareText = `Gửi bạn vị trí: ${item.name}\nĐịa chỉ: ${item.city} - ${item.info}\nLink Google Map: ${item.mapLink}`;

      try {
        const response = await fetch(item.image);
        const blob = await response.blob();
        const file = new File([blob], 'building.jpg', { type: blob.type || 'image/jpeg' });

        if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({
            files: [file],
            title: item.name,
            text: shareText
          });
          return;
        }
      } catch (err) {
        console.log('Không gửi được file ảnh:', err);
      }

      const fallbackUrl = `https://wa.me/?text=${encodeURIComponent(shareText)}`;
      window.open(fallbackUrl, '_blank');
    }

    async function handleSearch() {
      const input = document.getElementById('customerLink').value.trim();
      const errorDiv = document.getElementById('errorMessage');
      const resultsContainer = document.getElementById('resultsContainer');
      const resultsList = document.getElementById('resultsList');
      const btn = document.getElementById('searchBtn');

      errorDiv.classList.add('hidden');
      resultsContainer.classList.add('hidden');
      resultsList.innerHTML = '';

      if (!input) {
        showError("Vui lòng nhập link Google Map hoặc tọa độ của khách.");
        return;
      }

      const originalBtnText = btn.innerText;
      btn.innerText = "Đang tra cứu...";
      btn.disabled = true;

      try {
        const coords = await extractCoordsFromUrl(input);

        if (!coords) {
          showError("Không tự động giải mã được link ngắn này. Bạn hãy nhấp mở link trên trình duyệt cho nó load hết, rồi copy đường link dài dán vào lại nhé.");
          return;
        }

        const results = locationsData.map(item => {
          const dist = calculateDistance(coords.lat, coords.lng, item.lat, item.lng);
          return { ...item, distance: parseFloat(dist) };
        });

        results.sort((a, b) => a.distance - b.distance);
        currentResults = results;

        results.forEach((item, index) => {
          const itemHtml = `
            <div class="flex flex-col justify-between p-3 border border-gray-200 rounded-xl hover:shadow-md transition bg-white gap-2.5">
              <div class="flex items-start gap-2.5">
                <img
                  src="${item.image}"
                  alt="${item.name}"
                  class="w-14 h-14 sm:w-16 sm:h-16 object-cover rounded-lg border bg-gray-50 flex-shrink-0"
                  onerror="this.src='https://via.placeholder.com/80?text=No+Image'"
                />
                <div class="min-w-0 flex-1">
                  <h3 class="font-bold text-gray-800 text-xs sm:text-sm truncate">${item.name}</h3>
                  <p class="text-[11px] sm:text-xs text-gray-500 truncate mt-0.5">${item.city}</p>
                  <p class="text-[11px] sm:text-xs text-gray-600 line-clamp-1 mt-0.5">${item.info}</p>
                </div>
              </div>

              <div class="flex items-center justify-between border-t border-gray-100 pt-2 mt-auto gap-1.5">
                <span class="text-xs sm:text-sm font-extrabold text-blue-600 whitespace-nowrap">${item.distance} km</span>

                <div class="flex items-center gap-1">
                  <button
                    onclick="copyMapLink('${item.mapLink}', this)"
                    class="inline-flex items-center gap-1 bg-gray-100 hover:bg-gray-200 text-gray-700 text-[10px] sm:text-xs font-medium px-2 py-1.5 rounded transition"
                  >
                    📋 Copy Link
                  </button>

                  <button
                    onclick="shareLocationWithImage(${index})"
                    class="inline-flex items-center gap-1 bg-green-500 hover:bg-green-600 text-white text-[10px] sm:text-xs font-medium px-2 py-1.5 rounded transition shadow-sm"
                  >
                    <svg class="w-3 h-3 fill-current" viewBox="0 0 24 24">
                      <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/>
                    </svg>
                    WhatsApp
                  </button>
                </div>
              </div>
            </div>
          `;
          resultsList.insertAdjacentHTML('beforeend', itemHtml);
        });

        resultsContainer.classList.remove('hidden');
      } finally {
        btn.innerText = originalBtnText;
        btn.disabled = false;
      }
    }

    function showError(msg) {
      const errorDiv = document.getElementById('errorMessage');
      errorDiv.innerText = msg;
      errorDiv.classList.remove('hidden');
    }
  </script>
</body>
</html>
